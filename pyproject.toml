[project]
name = "eqfx"
version = "1.0.0"
description = "eqFX — a compact system-wide PipeWire equalizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
eqfx = "eqfx.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqfx = ["core/data/*.json"]
